# Poka-Yoke fail-closed gate -- halts on any lint error or secret detection.

name: Poka-Yoke Build Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code_quality_and_security_gate:
    name: Lint, Format, and Security Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # needed for gitleaks full history scan

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install django djangorestframework black flake8

      - name: Check Code Formatting (Black)
        run: |
          black --check .

      - name: Lint Source Code (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # using CLI binary directly -- gitleaks-action needs a paid license for public repos
      - name: Install Gitleaks CLI
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for Hardcoded Credentials (Gitleaks)
        run: |
          gitleaks detect --source=. --config=.gitleaks.toml --verbose

      - name: Validate Gate Clear
        run: |
          echo "BUILD PASSED -- SAFE TO DEPLOY"
