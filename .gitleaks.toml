title = "HabotConnect Gitleaks Allowlist Configuration"

[allowlist]
  description = "Allowlist for known safe development-only secrets"
  regexTarget = "match"
  regexes = [
    '''django-insecure-testing-key-for-habotconnect-onboarding-system''',
  ]
